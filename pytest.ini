[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Default invocation skips benchmark tests so the regular suite stays
# fast. Run benchmarks explicitly with:
#   pytest tests/benchmarks --benchmark-only -m benchmark
addopts =
    -v
    --cov=src/videomerger
    --cov-report=html
    --cov-report=term-missing
    --strict-markers
    -m "not benchmark"

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    benchmark: Performance benchmark (deselected by default, run with --benchmark-only)
